name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run dependency-free tests
        run: dotnet run --project tests/NobodyOrderAutomation.Tests/NobodyOrderAutomation.Tests.csproj -c Release

